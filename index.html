<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>الحضور والانصراف</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div class="hero"><img src="logo.png" alt=""><h1>نظام الحضور والانصراف</h1></div>
<div class="card" id="login"><h3>تسجيل الدخول</h3>
<input id="u" placeholder="اسم المستخدم" autocapitalize="off"><input id="p" type="password" placeholder="كلمة المرور">
<button onclick="doLogin()" style="width:100%">دخول</button><div id="e1"></div></div>
<div class="card" id="main" hidden><h3 id="hi"></h3><p id="st"></p>
<div id="reader" style="width:100%"></div>
<button id="scan" onclick="scan()" style="width:100%">📷 امسح رمز الصيدلية</button>
<div id="res"></div><button class="sec sm" onclick="logout()" style="margin-top:10px">خروج</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.getElementById(s);
const dev=localStorage.dev||(localStorage.dev=crypto.randomUUID());
const hm=x=>x?new Date(x).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Baghdad'}):'—';
async function doLogin(){const{data,error}=await sb.rpc('employee_login',{u:$('u').value.trim(),pw:$('p').value,dev});
 if(error)return $('e1').innerHTML=`<div class="msg err">${error.message}</div>`;
 localStorage.tk=data.token;home()}
function logout(){localStorage.removeItem('tk');location.reload()}
async function home(){if(!localStorage.tk)return;
 const{data,error}=await sb.rpc('my_status',{tk:localStorage.tk});if(error)return logout();
 $('login').hidden=true;$('main').hidden=false;$('hi').textContent='أهلاً '+data.name;
 $('st').textContent=`الحضور: ${hm(data.in)}  |  الانصراف: ${hm(data.out)}`}
let qr;
async function scan(){$('res').innerHTML='';qr=new Html5Qrcode('reader');
 try{await qr.start({facingMode:'environment'},{fps:10,qrbox:240},onScan)}catch(e){$('res').innerHTML='<div class="msg err">تعذر فتح الكاميرا، اسمح بالصلاحية</div>'}}
function pos(){return new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>r(p.coords),()=>r({}),{enableHighAccuracy:true,timeout:10000}):r({}))}
async function onScan(txt){await qr.stop().catch(()=>{});let j;try{j=JSON.parse(txt)}catch{return $('res').innerHTML='<div class="msg err">رمز غير صالح</div>'}
 $('res').textContent='جارٍ التحقق...';const c=await pos();
 const{data,error}=await sb.rpc('punch',{tk:localStorage.tk,p:j.p,t:j.t,lat:c.latitude??null,lng:c.longitude??null});
 if(error)return $('res').innerHTML=`<div class="msg err">${error.message}</div>`;
 $('res').innerHTML=data.type=='in'?`<div class="msg ok">✅ تم تسجيل الحضور ${data.time}${data.late?` — تأخير ${data.late} دقيقة`:''}</div>`
  :`<div class="msg ok">👋 تم تسجيل الانصراف ${data.time}${data.early?` — خروج مبكر ${data.early} دقيقة`:''}</div>`;home()}
home();
</script></body></html>
